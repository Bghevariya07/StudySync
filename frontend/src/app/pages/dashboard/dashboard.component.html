<main class="bg-gray-50">
  <h1 class="text-2xl font-bold mb-8">
    WELCOME BACK, <span class="text-blue-600">{{ user?.user.firstname?.toUpperCase() }}!</span>
  </h1>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6 rounded-lg">

    <!-- Hosting Section -->
    <div class="bg-white p-4 rounded-lg shadow h-[400px] flex flex-col">
      <h2 class="font-bold text-xl mb-4">Sessions You're Hosting</h2>
  
      <div class="overflow-y-auto pr-2 flex-1">
        <div *ngFor="let day of hostingSessionsByDay | keyvalue : sortByDateKey; let last = last" class="mb-4">
          <div class="inline-block bg-blue-600 text-white px-3 py-1 rounded-lg mb-2 font-semibold text-lg w-full">
            {{ day.key }}
          </div>
  
          <div class="space-y-1 text-gray-800 pl-2">
            <div *ngFor="let session of day.value">
              {{ session }}
            </div>
          </div>
  
          <hr *ngIf="!last" class="mt-3 border-gray-300" />
        </div>
      </div>
    </div>
  
    <!-- Joined Section -->
    <div class="bg-white p-4 rounded-lg shadow h-[400px] flex flex-col">
      <h2 class="font-bold text-xl mb-4">Sessions You've Joined</h2>
  
      <div class="overflow-y-auto pr-2 flex-1">
        <div *ngFor="let day of joinedSessionsByDay | keyvalue : sortByDateKey; let last = last" class="mb-4">
          <div class="inline-block bg-blue-600 text-white px-3 py-1 rounded-lg mb-2 font-semibold text-lg w-full">
            {{ day.key }}
          </div>
  
          <div class="space-y-1 text-gray-800 pl-2">
            <div *ngFor="let session of day.value">
              {{ session }}
            </div>
          </div>
  
          <hr *ngIf="!last" class="mt-3 border-gray-300" />
        </div>
      </div>
    </div>
  
  </div>
  
</main>
