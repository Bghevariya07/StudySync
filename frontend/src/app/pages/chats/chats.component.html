<div class="flex h-screen">
    <!-- Sidebar -->
    <div class="w-1/3 border-r p-4 overflow-y-auto">
      <h2 class="text-lg font-semibold mb-4">Conversations</h2>
      <div *ngFor="let conv of conversations" 
           class="p-2 rounded cursor-pointer hover:bg-gray-100"
           [class.bg-blue-100]="selectedConversation?.receiverId === conv.receiverId"
           (click)="selectConversation(conv)">
        <div class="font-semibold">{{ conv.senderId }}</div>
        <div class="text-sm text-gray-500">{{ conv.lastMessage }}</div>
      </div>
    </div>
  
    <!-- Chat Window -->
    <div class="w-2/3 p-4 flex flex-col">
      <div *ngIf="selectedConversation" class="bg-gray-100 p-3 rounded mb-4 font-semibold">
        {{ selectedConversation.name }}
      </div>
      <div class="flex-1 overflow-y-auto space-y-3">
        <div *ngFor="let msg of messages" [ngClass]="{
              'text-right': msg.senderId === username,
              'text-left': msg.senderId !== username
            }">
          <span [ngClass]="{
              'bg-[var(--blue)] text-white': msg.senderId === username,
              'bg-gray-200': msg.senderId !== username
            }"
            class="inline-block px-4 py-2 rounded-lg max-w-[70%]">
            {{ msg.message }}
          </span>
        </div>
      </div>
      <div class="flex mt-4">
        <input [(ngModel)]="newMessage" placeholder="Write a message" class="flex-1 border p-2 rounded-l" />
        <button (click)="sendMessage()" class="bg-[var(--blue)] px-4 text-white rounded-r">Send</button>
      </div>
    </div>
  </div>
